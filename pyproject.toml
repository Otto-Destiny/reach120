[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reach120"
version = "0.1.0"
description = "Travel time to emergency obstetric care in Nigerian states, and hospital upgrades ranked within a budget."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "numba>=0.59",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "pyogrio>=0.7",
  "rasterio>=1.3.9",
  "ortools>=9.8",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "requests>=2.31",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reach120 = "reach120.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
